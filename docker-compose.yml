services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - kolia-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kolia}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kolia}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kolia}
      IA_SERVICE_URL: http://ia-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kolia-network
    restart: unless-stopped

  ia-service:
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OLLAMA_URL: http://ollama:11434/api/generate
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      NUM_CTX: ${NUM_CTX:-32768}
      MAX_TOKENS_ENTRADA_BLOCO: ${MAX_TOKENS_ENTRADA_BLOCO:-2500}
      OVERLAP_TOKENS: ${OVERLAP_TOKENS:-200}
      TOKENS_RESPOSTA_BLOCO: ${TOKENS_RESPOSTA_BLOCO:-4096}
      TOKENS_RESPOSTA_CONSOLIDACAO: ${TOKENS_RESPOSTA_CONSOLIDACAO:-4096}
    volumes:
      - ./ia/logs:/app/logs
    depends_on:
      - ollama
    networks:
      - kolia-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - kolia-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    # Avoid conflicting local Postgres: map to 5433
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kolia}
      POSTGRES_USER: ${POSTGRES_USER:-kolia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kolia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolia} -d ${POSTGRES_DB:-kolia}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kolia-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
