services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - kolia-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kolia}:${POSTGRES_PASSWORD:-kolia}@postgres:5432/${POSTGRES_DB:-kolia}
      SECRET_KEY: ${JWT_SECRET}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 7
      IA_SERVICE_URL: http://ia-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kolia-network
    restart: unless-stopped

  ia-service:
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kolia}:${POSTGRES_PASSWORD:-kolia}@postgres:5432/${POSTGRES_DB:-kolia}
      SECRET_KEY: ${JWT_SECRET}
      ALGORITHM: HS256
      MAX_TOKENS_PER_CHUNK: ${MAX_TOKENS_PER_CHUNK:-2500}
      OVERLAP_TOKENS: ${OVERLAP_TOKENS:-200}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_GENERATE_URL: http://ollama:11434/api/generate
      OLLAMA_EMBED_URL: http://ollama:11434/api/embed
      OLLAMA_THINK: ${OLLAMA_THINK:-True}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      OLLAMA_CHUNK_THINK: ${OLLAMA_CHUNK_THINK:-true}
      OLLAMA_CHUNK_NUM_PREDICT: ${OLLAMA_CHUNK_NUM_PREDICT:-768}
      OLLAMA_CONSOLIDATION_THINK: ${OLLAMA_CONSOLIDATION_THINK:-true}
      OLLAMA_CONSOLIDATION_NUM_PREDICT: ${OLLAMA_CONSOLIDATION_NUM_PREDICT:-1024}
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./ia/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - kolia-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - kolia-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    # Avoid conflicting local Postgres: map to 5433
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kolia}
      POSTGRES_USER: ${POSTGRES_USER:-kolia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kolia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolia} -d ${POSTGRES_DB:-kolia}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kolia-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
