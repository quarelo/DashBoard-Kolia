services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - kolia-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kolia}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kolia}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kolia}
      IA_SERVICE_URL: http://ia-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kolia-network
    restart: unless-stopped

  ia-service:
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kolia}:${POSTGRES_PASSWORD:-kolia}@postgres:5432/${POSTGRES_DB:-kolia}
      MAX_TOKENS_PER_CHUNK: ${MAX_TOKENS_PER_CHUNK:-2000}
      OVERLAP_TOKENS: ${OVERLAP_TOKENS:-120}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_GENERATE_URL: http://ollama:11434/api/generate
      OLLAMA_EMBED_URL: http://ollama:11434/api/embed
      OLLAMA_THINK: ${OLLAMA_THINK:-True}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      OLLAMA_CHUNK_THINK: ${OLLAMA_CHUNK_THINK:-false}
      OLLAMA_CHUNK_NUM_PREDICT: ${OLLAMA_CHUNK_NUM_PREDICT:-192}
      OLLAMA_CONSOLIDATION_THINK: ${OLLAMA_CONSOLIDATION_THINK:-false}
      OLLAMA_CONSOLIDATION_NUM_PREDICT: ${OLLAMA_CONSOLIDATION_NUM_PREDICT:-384}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_GENERATE_TIMEOUT_SECONDS: ${OLLAMA_GENERATE_TIMEOUT_SECONDS:-600}
      OLLAMA_EMBEDDING_TIMEOUT_SECONDS: ${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:-120}
      OLLAMA_READ_TIMEOUT_RETRIES: ${OLLAMA_READ_TIMEOUT_RETRIES:-1}
      OLLAMA_JSON_REPAIR_ENABLED: ${OLLAMA_JSON_REPAIR_ENABLED:-true}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-512}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.0}
      CHAT_CONTEXT_LENGTH: ${CHAT_CONTEXT_LENGTH:-8192}
      CHAT_SIMILARITY_THRESHOLD: ${CHAT_SIMILARITY_THRESHOLD:-0.55}
      CHAT_MAX_EVIDENCE_CHARS: ${CHAT_MAX_EVIDENCE_CHARS:-2000}
      CHAT_GENERATE_TIMEOUT_SECONDS: ${CHAT_GENERATE_TIMEOUT_SECONDS:-120}
      ANALYSIS_WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY:-1}
      CHUNK_PROCESSING_CONCURRENCY: ${CHUNK_PROCESSING_CONCURRENCY:-2}
      PARTIAL_CHUNK_COUNT: ${PARTIAL_CHUNK_COUNT:-6}
      MAX_LLM_CHUNKS: ${MAX_LLM_CHUNKS:-15}
      FAST_TRANSCRIPTION_RETENTION_RATIO: ${FAST_TRANSCRIPTION_RETENTION_RATIO:-0.05}
      FAST_DETERMINISTIC_CONSOLIDATION: ${FAST_DETERMINISTIC_CONSOLIDATION:-true}
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      CHUNK_MODEL: ${OLLAMA_CHUNK_MODEL:-gemma3:1b}
      CONSOLIDATION_MODEL: ${OLLAMA_CONSOLIDATION_MODEL:-gemma3:1b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./ia/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - kolia-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_QUEUE: 64
    networks:
      - kolia-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    # Avoid conflicting local Postgres: map to 5433
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kolia}
      POSTGRES_USER: ${POSTGRES_USER:-kolia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kolia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolia} -d ${POSTGRES_DB:-kolia}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kolia-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
